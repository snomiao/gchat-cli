# Build and install test of the Rust port, on the rustify pipeline.
# From rustify's templates/github/rust-npm-release.yml, with the `publish` and
# `verify` jobs and the `workflow_call` trigger removed: this workflow cannot
# publish anything. Releases are still cut by release.yml (semantic-release).
#
# A pull request builds every platform, runs the parity cases against the
# Linux binary, and smoke-tests the install on Linux, macOS and Windows.

name: rust-npm-release

on:
  pull_request:
    paths:
      - "rs/**"
      # The parity cases compare the binary with the TypeScript, so a change
      # to either side has to run them.
      - "ts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/rust-npm-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (default: the version in Cargo.toml)"
        required: false
        type: string
      npm_tag:
        description: "npm dist-tag the packages are packed for (nothing is published)"
        required: false
        default: latest
        type: string

jobs:
  build:
    uses: snomiao/rustify/.github/workflows/rust-npm-build.yml@releases/v1
    with:
      manifest: rs/Cargo.toml
      bins: gchat-cli
      # The install test's main command. Not `gchat --version`: that is
      # yargs's, and installed with `bun i -g` it prints "unknown", today's
      # TypeScript-only package included (yargs looks for package.json above
      # the node_modules that holds yargs, which bun keeps flat). --help is
      # handed back the same way and prints the same text everywhere.
      smoke: gchat --help
      smoke-expect: gchat <command> [args]
      version: ${{ inputs.version }}
      npm-tag: ${{ inputs.npm_tag || 'latest' }}
      # The binary hands back to ts/cli.ts, which needs no build. dist/cli.js
      # is built because the package ships it today (`files` lists dist/).
      js-build: bun install --frozen-lockfile && bun run build
      # Rust against TypeScript, on the Linux binary that was just built.
      # The cases carry the checkout's path (for the fake gws, and for the
      # JavaScript a handed-back invocation runs), so they are written afresh.
      parity: bun install --frozen-lockfile && node rs/parity.gen.mjs && node "$RUSTIFY_PARITY" --cases rs/parity.json --ts "bun ts/cli.ts" --rs "$RUSTIFY_BIN_DIR/gchat-cli"
      # Run once on every platform after installing. --version only has to
      # exit 0 (see above). The other is a ported command on a machine without
      # gws: Rust takes it, cannot start gws, and hands it back, and the
      # JavaScript then prints the confirm prompt. It is the first step of a
      # send, which only asks; nothing is posted and there is no gws to post with.
      smoke-extra: |
        gchat --version =>
        gchat send spaces/RUSTIFY-SMOKE hello => Re-run within 60s with --code=4149dc5a to send.
