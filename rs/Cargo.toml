[package]
name = "gchat-cli"
version = "0.0.0"
edition = "2021"
description = "Google Chat CLI — list spaces, read / send / tail messages, resolve space names, with a send confirm-guard."
license = "MIT"

[[bin]]
name = "gchat-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
